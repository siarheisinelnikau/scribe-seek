[package]
name = "scribe-seek"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "Local audio transcription with searchable, playable timestamps"
license = "MIT"
repository = "https://github.com/siarheisinelnikau/scribe-seek"

[dependencies]
anyhow = "1.0"
audiopus_sys = { version = "0.2.2", features = ["static"] }
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
rfd = "0.15.4"
ogg = "0.9.2"
opus = "0.3.1"
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
rubato = "0.16.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
sha2 = "0.10"
symphonia = { version = "0.5.5", features = ["all"] }
ureq = "3.5"
whisper-rs = "0.16.0"

[target.'cfg(windows)'.dependencies]
bytemuck = "1"
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.audiopus_sys]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.egui_software_backend]
opt-level = 3
